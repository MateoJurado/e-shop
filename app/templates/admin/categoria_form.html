{% extends 'base.html' %}

{% block title %}

{% if categoria %}
Editar Categoría
{% else %}
Nueva Categoría
{% endif %}

{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-header">

                <h4>

                {% if categoria %}
                    Editar Categoría
                {% else %}
                    Nueva Categoría
                {% endif %}

                </h4>

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">

                            Nombre

                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="nombre"
                            required

                            value="{% if categoria %}{{ categoria.nombre }}{% endif %}">

                    </div>

                    <div class="mb-3">

                        <label class="form-label">

                            Descripción

                        </label>

                        <textarea
                            class="form-control"
                            name="descripcion"
                            rows="4">{% if categoria %}{{ categoria.descripcion }}{% endif %}</textarea>

                    </div>

                    <button
                        class="btn btn-primary">

                        Guardar

                    </button>

                    <a
                        href="{{ url_for('admin.categorias') }}"
                        class="btn btn-secondary">

                        Cancelar

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
