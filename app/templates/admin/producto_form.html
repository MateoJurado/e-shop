{% extends 'base.html' %}

{% block title %}Nuevo Producto{% endblock %}

{% block content %}

<h2>

{% if producto %}

Editar Producto

{% else %}

Nuevo Producto

{% endif %}

</h2>

<form method="POST">

    <div class="mb-3">
        <label>Nombre</label>
        <input
            type="text"
            name="nombre"
            class="form-control"
            value="{{ producto.nombre if producto else '' }}"
            required>
    </div>

    <div class="mb-3">
        <label>Descripción</label>
        <textarea
           name="descripcion"
           class="form-control">{{ producto.descripcion if producto else '' }}</textarea>
    </div>

    <div class="mb-3">
        <label>Precio</label>
        <input
           type="number"
           step="0.01"
           name="precio"
           class="form-control"
           value="{{ producto.precio if producto else '' }}"
           required>
    </div>

    <div class="mb-3">
        <label>Stock</label>
        <input
          type="number"
          name="stock"
          class="form-control"
          value="{{ producto.stock if producto else '' }}"
          required>
    </div>

    <div class="mb-3">
        <label>Categoría</label>

        <select
          name="categoria_id"
          class="form-select">

    {% for c in categorias %}

        <option
            value="{{ c.id }}"
            {% if producto and producto.categoria_id == c.id %}
                selected
            {% endif %}
        >
            {{ c.nombre }}
        </option>

    {% endfor %}

</select>

    </div>

    <button class="btn btn-success">

        Guardar

    </button>

    <a href="{{ url_for('admin.productos') }}"
       class="btn btn-secondary">

        Cancelar

    </a>

</form>

{% endblock %}
